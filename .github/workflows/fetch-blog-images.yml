name: Fetch blog images

# Ghost에서 옮겨온 글의 이미지를 내려받아 public/blog/images 에 커밋합니다.
# content/image-manifest.json 이 바뀌면 자동 실행되며, Actions 탭에서 수동 실행도 가능합니다.
on:
  push:
    paths:
      - content/image-manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-blog-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/fetch-blog-images.mjs

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add public/blog content
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "블로그 이미지 내려받기 (Ghost → public/blog/images)"
          git pull --rebase
          git push
